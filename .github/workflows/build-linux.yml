name: Build Linux

# En esta versión de portfolio solo se dispara a mano (requiere secrets).
on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Correr tests
        run: python -m pytest -q

      - name: Instalar dpkg y tkinter
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg python3-tk
          # python3-tk es necesario a partir de que el punto de entrada
          # pasó a ser launcher.py (ventana gráfica con tkinter). En
          # Ubuntu tkinter NO viene incluido con el Python base, a
          # diferencia de Windows, así que sin este paquete pyinstaller
          # no puede empaquetar el módulo o el binario final falla al
          # abrir la ventana.

      - name: Construir paquete DEB
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          chmod +x installer/linux/build-deb.sh
          ./installer/linux/build-deb.sh

      - name: Subir instalador
        uses: actions/upload-artifact@v7
        with:
          name: GestionDeLocal-DEB
          path: /tmp/gestiondelocal-build/GestionDeLocal-*.deb